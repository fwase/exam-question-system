[project]
name = "exam-question-system"
version = "0.1.0"
description = "Sistema de consulta de questões de provas em linguagem natural"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = ["pandas (>=3.1.1,<4.0.0)", "pyarrow (>=26.0.1,<27.0.0)", "sqlalchemy (>=2.1.9,<3.0.0)", "alembic (>=1.20.1,<2.0.0)", "psycopg[binary] (>=3.3.9,<4.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
