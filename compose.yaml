services:
  postgres:
    image: postgres:17-alpine
    container_name: exam_question_system_postgres
    environment:
      POSTGRES_DB: question_system_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d question_system_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
